<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUM Spelling Bee - 16:9 Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #FFD966;
            --light-yellow: #FFF2CC;
            --honey-orange: #F4B183;
            --dark-brown: #593E26;
            --soft-white: #FFFAEE;
            --correct-green: #A9D18E;
            --incorrect-red: #FF9999;
            --alert-red: #d9534f;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #1a1a1a; 
            color: var(--dark-brown);
            height: 100vh; width: 100vw; overflow: hidden; user-select: none;
            display: flex; align-items: center; justify-content: center;
        }

        h1, h2, h3, button, select, #prep-counter, .timer-display, #game-word { 
            font-family: 'Fredoka One', cursive, sans-serif; 
        }

        .page {
            display: none; 
            width: 100vw; 
            aspect-ratio: 16 / 9; 
            max-height: 100vh;
            background: radial-gradient(circle at center, var(--soft-white) 0%, var(--light-yellow) 100%);
            position: relative; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .active { display: flex; }

        .page::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 250, 238, 0.4); z-index: 1;
        }
        #main-page::before { background-color: rgba(255, 250, 238, 0.1); }
        #game-page::before { display: none; } 
        .page > * { z-index: 2; }

        button, select {
            background-color: var(--primary-yellow);
            color: var(--dark-brown);
            border: 3px solid var(--honey-orange);
            border-radius: 20px;
            padding: 10px 20px; font-size: 1.1rem;
            cursor: pointer; transition: all 0.2s;
            outline: none;
        }
        button:hover { transform: translateY(-2px); background-color: var(--honey-orange); color: white; }
        button:disabled { background-color: #ccc !important; border-color: #aaa !important; color: #888 !important; cursor: not-allowed; transform: none !important; }

        .utility-btn {
            position: absolute;
            bottom: 15px;
            font-size: 0.85rem;
            padding: 5px 12px;
            border-radius: 12px;
            background-color: rgba(89, 62, 38, 0.1);
            border: 2px solid var(--dark-brown);
            color: var(--dark-brown);
            z-index: 10;
            opacity: 0.7;
        }
        .utility-btn:hover {
            opacity: 1;
            transform: translateY(-1px);
            background-color: var(--dark-brown);
            color: white;
        }

        .pos-speed { right: 15px; } 
        .pos-reveal { right: 130px; } 

        .btn-active {
            background-color: var(--honey-orange);
            color: white;
            opacity: 0.9;
        }

        #main-page { background-image: url('image_0.png'); background-size: 100% 100%; }
        .top-logo { 
            position: absolute; top: 0%; left: 50%; 
            transform: translateX(-50%); width: 1200px; 
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.15)); 
        }
        .main-controls { display: flex; gap: 25px; align-items: center; margin-top: 35vh; }

        #prep-page { 
            background-color: var(--primary-yellow) !important; 
            background-image: none !important; 
        }
        #prep-page::before { display: none; }
        #prep-counter { 
            font-size: 15rem; 
            color: white; 
            text-shadow: 10px 10px 0px var(--honey-orange); 
            z-index: 10;
        }

        #game-page { background-image: url('spfun1.png'); background-size: 100% 100%; }
        .timer-display { font-size: 4rem; background: white; padding: 10px 30px; border-radius: 30px; border: 5px solid var(--primary-yellow); transition: all 0.2s; }
        .timer-out { color: var(--alert-red); border-color: var(--alert-red); transform: scale(1.1); box-shadow: 0 0 20px rgba(217, 83, 79, 0.3); }
        #game-word { font-size: 7rem; text-align: center; margin-bottom: 40px; min-height: 140px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .word-hidden { 
            color: #b1a796 !important; 
            font-size: 3.5rem !important; 
            opacity: 0.6; 
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--soft-white); padding: 30px 40px; border-radius: 30px; text-align: center; border: 5px solid var(--honey-orange); max-width: 800px; width: 90%; }
        
        textarea { width: 100%; height: 180px; border-radius: 15px; border: 3px solid var(--honey-orange); padding: 15px; font-size: 1.1rem; resize: none; font-family: 'Nunito', sans-serif; box-sizing: border-box; margin-top: 10px; }
        .word-list-box { max-height: 120px; overflow-y: auto; background: white; border: 2px solid var(--honey-orange); border-radius: 10px; padding: 10px; margin-top: 10px; text-align: left; display: flex; flex-wrap: wrap; gap: 8px; }
        .word-chip { background: var(--light-yellow); border: 1px solid var(--honey-orange); padding: 3px 10px; border-radius: 15px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <audio id="ding-sound" src="Ding_1.mp3"></audio>

    <div id="main-page" class="page active">
        <img src="logo_01.png" class="top-logo" onerror="this.style.display='none'">
        <div style="position:absolute; top:20px; right:20px; display:flex; gap:15px;">
            <button onclick="openBankModal()">📚 Input Word Bank</button>
        </div>
        
        <div class="main-controls">
            <button onclick="startPreparation()" style="font-size: 1.5rem; padding: 15px 40px;">▶ START!</button>
            <button onclick="setTime()" id="btn-time">⏱ 60s</button>
        </div>

        <p id="word-count-status" style="position:absolute; bottom:45px; left:20px; margin:0; font-weight:bold; font-size:1.1rem; color:#f6efe5;">Current Words: 0</p>
        <p id="dict-status" style="position:absolute; bottom:15px; left:20px; margin:0; font-weight:bold; font-size:0.85rem; opacity:0.8; color:#f6efe5">Dictionary: Ready</p>
    </div>

    <div id="prep-page" class="page"><div id="prep-counter">3</div></div>

    <div id="game-page" class="page">
        <div style="position:absolute; top:20px; left:40px; right:40px; display:flex; justify-content:space-between; align-items:center;">
            <button onclick="endGameEarly()">⬅ BACK</button>
            <div class="timer-display" id="timer">00:00</div>
        </div>
        <div id="game-word" onclick="toggleWordVisibility(event)">Word</div>
        <div style="display:flex; gap:35px;">
            <button style="background-color:var(--incorrect-red); font-size:1.4rem; padding: 15px 40px;" onclick="markAnswer(false)">✖ Incorrect</button>
            <button style="background-color:var(--primary-yellow);" onclick="speakCurrentWord()">🔊 Pardon</button>
            <button style="background-color:var(--correct-green); font-size:1.4rem; padding: 15px 40px;" onclick="markAnswer(true)">✔ Correct</button>
        </div>

        <button class="utility-btn pos-reveal btn-active" id="btn-reveal-switch" onclick="toggleRevealMode(event)">🔍 Hide: ON</button>
        <button class="utility-btn pos-speed" id="btn-speech-speed" onclick="adjustSpeechSpeed(event)">⚡ Speed: 0.8</button>
    </div>

    <div class="modal-overlay" id="bank-modal">
        <div class="modal">
            <h2>📚 Input Word Bank</h2>
            <p style="margin: 0; font-size:0.95rem;">Paste/Type words below (one word per line):</p>
            <textarea id="bulk-input" placeholder="apple&#10;banana&#10;orange..."></textarea>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="addWords(true)" style="flex:1;">➕ Add (Check Dict)</button>
                <button onclick="addWords(false)" style="flex:1; background-color: #FFCC00;">🔥 Force Add</button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                <span id="modal-word-count" style="font-weight:bold;">Total Words: 0</span>
                <div>
                    <button onclick="clearCurrentLevel()" style="background-color:var(--alert-red); color:white; padding:5px 12px; font-size:0.85rem;">🔥 Clear All</button>
                </div>
            </div>

            <div class="word-list-box" id="word-chip-container"></div>

            <div style="margin-top:20px;">
                <button onclick="closeBankModal()" style="background-color:var(--correct-green); padding: 10px 40px;">OK / Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal">
            <h2>Time's Up! ⏱</h2>
            <p style="font-size:2.5rem; color:var(--correct-green);">✔ Correct: <span id="res-correct">0</span></p>
            <p style="font-size:2.5rem; color:var(--incorrect-red);">✖ Incorrect: <span id="res-incorrect">0</span></p>
            <button onclick="closeModalAndHome()">Back to Home</button>
        </div>
    </div>

    <script>
    // 預設字庫（避免第一次開啟因為沒輸入字庫而無法啟動）
    const defaultWords = ["apple", "banana", "bee", "honey", "whiteboard", "yellow", "school", "teacher", "student", "classroom"];
    let wordBank = [];
    let englishDictionary = new Set(["a", "apple", "bee", "honey", "whiteboard", "center", "centre", "color", "colour", "banana", "yellow", "school", "teacher", "student", "classroom"]); 
    
    let gameTimeLimit = 60;
    let timerInterval = null;
    let remainingTime = 0;
    let score = { correct: 0, incorrect: 0 };
    let gameWords = [];
    let currentWord = "";
    let timeIsUp = false;
    let isWordRevealed = false;
    let isHideModeActive = true;
    let speechSpeed = 0.8;

    const dingSound = document.getElementById("ding-sound");

    function playDing() {
        if (dingSound) {
            dingSound.currentTime = 0;
            dingSound.play().catch(e => {});
        }
    }

    function setTime() {
        var inputVal = window.prompt("Enter Game Time in Seconds (e.g. 30, 60, 90):", gameTimeLimit);
        if (inputVal !== null && inputVal.trim() !== "") {
            var num = parseInt(inputVal.trim(), 10);
            if (!isNaN(num) && num > 0) {
                gameTimeLimit = num;
                document.getElementById("btn-time").innerText = "⏱ " + gameTimeLimit + "s";
            } else {
                alert("Please enter a valid positive number.");
            }
        }
    }

    function adjustSpeechSpeed(e) {
        if(e) e.stopPropagation();
        let inputSpeed = prompt("Enter Speech Speed (Recommended: 0.5 - 1.5):", speechSpeed);
        if (inputSpeed !== null) {
            let parsed = parseFloat(inputSpeed);
            if (!isNaN(parsed) && parsed > 0 && parsed <= 3) {
                speechSpeed = parsed;
                document.getElementById("btn-speech-speed").innerText = "⚡ Speed: " + speechSpeed;
            } else { alert("Please enter a valid number between 0.1 and 3.0"); }
        }
    }

    function toggleRevealMode(e) {
        if(e) e.stopPropagation();
        isHideModeActive = !isHideModeActive;
        const btn = document.getElementById("btn-reveal-switch");
        const wordEl = document.getElementById("game-word");
        if (isHideModeActive) {
            btn.innerText = "🔍 Hide: ON";
            btn.classList.add("btn-active");
            isWordRevealed = false;
            wordEl.innerText = "[ Press Space to Reveal ]";
            wordEl.classList.add("word-hidden");
        } else {
            btn.innerText = "🔍 Hide: OFF";
            btn.classList.remove("btn-active");
            isWordRevealed = true;
            wordEl.innerText = currentWord;
            wordEl.classList.remove("word-hidden");
        }
    }

    function autoSaveToLocal() { 
        localStorage.setItem("ASUM_SINGLE_BANK", JSON.stringify(wordBank)); 
        updateWordCountDisplays();
    }

    function loadBank() {
        const data = localStorage.getItem("ASUM_SINGLE_BANK");
        if (data) { 
            try { 
                wordBank = JSON.parse(data); 
            } catch(e) { wordBank = []; }
        }
        if (!wordBank || wordBank.length === 0) {
            wordBank = [...defaultWords];
        }
        updateWordCountDisplays();
    }
    loadBank();

    function openBankModal() { renderWordChips(); document.getElementById("bank-modal").style.display = "flex"; }
    function closeBankModal() { document.getElementById("bank-modal").style.display = "none"; }

    function addWords(checkDict = true) {
        let lines = document.getElementById("bulk-input").value.split('\n');
        let added = 0, dups = 0, typoList = [];
        lines.forEach(line => {
            let entry = line.trim();
            if(!entry) return;
            if(!/^[a-zA-Z\s\-\/\(\)]+$/.test(entry)) { typoList.push(entry); return; }
            if(checkDict) {
                let segments = entry.toLowerCase().split(/[\s\/\(\)\-]+/).filter(s => s.length > 0);
                if(!segments.every(s => englishDictionary.has(s))) { typoList.push(entry); return; }
            }
            let isDuplicate = wordBank.map(w => w.toLowerCase()).includes(entry.toLowerCase());
            if(isDuplicate) { dups++; } else { wordBank.push(entry); added++; }
        });
        document.getElementById("bulk-input").value = "";
        renderWordChips(); autoSaveToLocal();
        let msg = `✅ Added: ${added}\n⚠️ Dups: ${dups}\n❌ Typos: ${typoList.length}`;
        if(typoList.length > 0) msg += `\n- ` + typoList.join('\n- ');
        alert(msg);
    }

    function renderWordChips() {
        const container = document.getElementById("word-chip-container");
        container.innerHTML = "";
        wordBank.forEach(w => {
            let chip = document.createElement("span");
            chip.className = "word-chip";
            chip.innerText = w;
            container.appendChild(chip);
        });
        updateWordCountDisplays();
    }

    function updateWordCountDisplays() {
        document.getElementById("word-count-status").innerText = "Current Words: " + wordBank.length;
        const modalCount = document.getElementById("modal-word-count");
        if(modalCount) modalCount.innerText = "Total Words: " + wordBank.length;
    }

    function clearCurrentLevel() { 
        if(confirm(`Clear all current words in word bank?`)) { 
            wordBank = []; renderWordChips(); autoSaveToLocal(); 
        } 
    }

    // 徹底修復的倒數與進入遊戲流程
    function startPreparation() {
        if (!wordBank || wordBank.length === 0) {
            wordBank = [...defaultWords];
        }

        showPage('prep-page');
        let count = 3;
        const prepCounter = document.getElementById('prep-counter');
        prepCounter.innerText = count;
        
        // 嘗試語音，不論失敗與否都靠純定時器推進
        trySpeak(count.toString());

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                prepCounter.innerText = count;
                trySpeak(count.toString());
            } else if (count === 0) {
                prepCounter.innerText = "START!";
                trySpeak("Start!");
            } else {
                clearInterval(timer);
                startGame();
            }
        }, 900);
    }

    function startGame() {
        timeIsUp = false; 
        score = { correct: 0, incorrect: 0 };
        gameWords = [...wordBank].sort(() => Math.random() - 0.5);
        remainingTime = gameTimeLimit || 60;

        document.getElementById("timer").classList.remove("timer-out");
        showPage("game-page"); 
        updateTimerDisplay(); 
        nextWord();

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => { 
            remainingTime--; 
            updateTimerDisplay(); 
            if(remainingTime <= 0) { 
                clearInterval(timerInterval);
                timeIsUp = true;
                playDing();
            }
        }, 1000);
    }

    function nextWord() {
        if (gameWords.length === 0) {
            endGameActual();
            return;
        }
        currentWord = gameWords.pop();
        const wordEl = document.getElementById("game-word");
        if (isHideModeActive) {
            isWordRevealed = false;
            wordEl.innerText = "[ Press Space to Reveal ]";
            wordEl.classList.add("word-hidden");
        } else {
            isWordRevealed = true;
            wordEl.innerText = currentWord;
            wordEl.classList.remove("word-hidden");
        }
        speakWord();
    }

    function toggleWordVisibility(e) {
        if(e) e.stopPropagation(); 
        if (!isHideModeActive) return; 
        const wordEl = document.getElementById("game-word");
        if (isWordRevealed) {
            wordEl.innerText = "[ Press Space to Reveal ]";
            wordEl.classList.add("word-hidden");
            isWordRevealed = false;
        } else {
            wordEl.innerText = currentWord;
            wordEl.classList.remove("word-hidden");
            isWordRevealed = true;
        }
    }

    window.addEventListener("keydown", function(e) {
        if (e.code === "Space" && document.getElementById("game-page").classList.contains("active")) {
            e.preventDefault(); 
            toggleWordVisibility();
        }
    });

    function markAnswer(correct) {
        if(correct) score.correct++; else score.incorrect++;
        if(timeIsUp || gameWords.length === 0) {
            playDing();
            endGameActual();
        } else { nextWord(); }
    }

    function endGameActual() {
        if (timerInterval) clearInterval(timerInterval);
        setTimeout(() => { 
            document.getElementById("res-correct").innerText = score.correct;
            document.getElementById("res-incorrect").innerText = score.incorrect;
            document.getElementById("result-modal").style.display = "flex"; 
        }, 300);
    }

    function updateTimerDisplay() {
        let m = Math.max(0, Math.floor(remainingTime / 60)).toString().padStart(2, "0");
        let s = Math.max(0, remainingTime % 60).toString().padStart(2, "0");
        const el = document.getElementById("timer");
        el.innerText = `${m}:${s}`;
        if(remainingTime <= 0) el.classList.add("timer-out");
        else el.classList.remove("timer-out");
    }

    function trySpeak(text) {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let m = new SpeechSynthesisUtterance(text);
                m.lang = "en-UK";
                window.speechSynthesis.speak(m);
            }
        } catch(e) {}
    }

    function speakWord() {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanWord = currentWord.split(/[\/\(]+/)[0].trim();
                let m = new SpeechSynthesisUtterance(cleanWord);
                m.lang = "en-UK"; 
                m.rate = speechSpeed; 
                window.speechSynthesis.speak(m);
            }
        } catch(e) {}
    }

    function speakCurrentWord() { speakWord(); }
    function showPage(id) { 
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active")); 
        document.getElementById(id).classList.add("active"); 
    }
    function goHome() { showPage("main-page"); }
    function endGameEarly() { 
        if (timerInterval) clearInterval(timerInterval); 
        timeIsUp = true; 
        try { if('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch(e){} 
        goHome(); 
    }
    function closeModalAndHome() { document.getElementById("result-modal").style.display = "none"; goHome(); }
    </script>
</body>
</html>
